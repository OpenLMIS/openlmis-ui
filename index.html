<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/olmis.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // iOS zooms into fields under 16px on focus; maximum-scale stops that but iOS still allows pinch zoom.
      if (/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        document.querySelector('meta[name="viewport"]').content += ', maximum-scale=1';
      }
      addEventListener('error', (event) => {
        if (!(event.target instanceof HTMLScriptElement) || event.target.type !== 'module') return;
        try {
          const last = Number(sessionStorage.getItem('openlmis-ui.boot-retry')) || 0;
          if (Date.now() - last < 10000) return;
          sessionStorage.setItem('openlmis-ui.boot-retry', String(Date.now()));
        } catch {
          return;
        }
        location.reload();
      }, true);
    </script>
    <link href="/src/globals.css" rel="stylesheet" />
    <title id="app-title">OpenLMIS UI</title>
    <meta name="description" content="Web frontend for OpenLMIS." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
