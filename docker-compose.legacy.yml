# Opt-in overlay that puts the REAL legacy UI next to ours on one origin.
#
# The session handoff only works same-origin, so it cannot be checked against a
# remote environment directly. This proxies everything we do not claim to a live
# OpenLMIS instance, which means http://localhost:8080 serves:
#
#   /        the real AngularJS UI, proxied from $OL_UPSTREAM
#   /api     that instance's real API
#   /v2      this repository's container
#
# Log in at /, open /v2, and the session carries with no second login.
#
#   docker compose -f docker-compose.yml -f docker-compose.legacy.yml up -d --build
#   ./scripts/register-legacy-proxy.sh
services:
  legacy-proxy:
    image: nginx:1.29-alpine
    environment:
      OL_UPSTREAM: ${OL_UPSTREAM:-test.openlmis.org}  # host only, no scheme
    volumes:
      - ./docker/legacy-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      consul:
        condition: service_healthy
