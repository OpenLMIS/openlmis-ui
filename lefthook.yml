pre-commit:
  parallel: true
  jobs:
    - name: biome check
      glob: "*.{js,ts,jsx,tsx,json,css}"
      run: pnpm biome check --write --no-errors-on-unmatched --staged {staged_files}
      stage_fixed: true

    - name: sort messages
      glob: "public/locales/*.json"
      run: pnpm sort-messages
      stage_fixed: true

    - name: typecheck
      run: pnpm tsc --noEmit

pre-push:
  parallel: true
  jobs:
    - name: biome check
      run: pnpm check

    - name: design-system lint
      run: pnpm lint:ds

    - name: typecheck
      run: pnpm tsc --noEmit

    - name: tests
      run: pnpm test:run
