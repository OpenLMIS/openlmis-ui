# Rehearses how openlmis-ui sits in a full OpenLMIS stack: Consul for discovery
# and the shared nginx gateway in front, exactly as uat_env wires them. There is
# no legacy UI or backend here, so /v2/* resolves and everything else 404s.
#
#   docker compose up --build   then open http://localhost:8080/v2/
services:
  consul:
    image: hashicorp/consul:1.15
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    environment:
      CONSUL_BIND_INTERFACE: eth0
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/v1/status/leader"]
      interval: 10s
      timeout: 5s
      retries: 20

  # The same image and routing mechanism the deployed environments use, so a
  # prefix that works here works there.
  nginx:
    image: openlmis/nginx:v7.1
    ports:
      - "8080:80"
    environment:
      VIRTUAL_HOST: localhost:8080
      NGINX_LOG_DIR: /var/log/nginx/log
      CLIENT_MAX_BODY_SIZE: 1m
      PROXY_CONNECT_TIMEOUT: 60s
      PROXY_SEND_TIMEOUT: 60s
      PROXY_READ_TIMEOUT: 60s
      SEND_TIMEOUT: 60s
      REQUIRE_SSL: "false"
    # NGINX_LOG_DIR is a mount point in the image, not a directory it creates.
    volumes:
      - nginx-log:/var/log/nginx/log
      - consul-template-log:/var/log/consul-template
    depends_on:
      consul:
        condition: service_healthy

  openlmis-ui:
    build:
      context: .
      args:
        BASE_PATH: ${OL_UI_BASE_PATH:-/v2}
    environment:
      BASE_PATH: ${OL_UI_BASE_PATH:-/v2}
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      SERVICE_NAME: openlmis-ui
      SERVICE_TAG: openlmis-service
      SERVICE_PORT: 80
    depends_on:
      consul:
        condition: service_healthy

volumes:
  nginx-log:
  consul-template-log:
